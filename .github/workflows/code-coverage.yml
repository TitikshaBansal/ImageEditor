name: Code Coverage

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up environment
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'  # Modify if you use a different version or language

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Modify if you have a different dependencies file
        pip install coverage  # Modify if you use a different coverage tool

    - name: Run tests and measure coverage
      run: |
        coverage run -m pytest  # Modify if you use a different test command
        coverage report
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      with:
        file: coverage.xml
        flags: unittests  # Modify with any flags you use
        name: codecov-umbrella
        fail_ci_if_error: true  # Optional
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Ensure you have this secret set up
