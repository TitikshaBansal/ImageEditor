name: Deployment

on:
  push:
    branches:
      - main  # Adjust branch name as needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Add build steps here if necessary
      # For C++ projects, build binaries or packages

      - name: Deploy to Production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}  # Ensure SSH key is stored in GitHub secrets
        run: |
          # Example: Deploy built binaries or packages using SSH
          # Replace with your actual deployment commands
          ssh -i <path_to_private_key> user@hostname 'cd /path/to/deploy && ./deploy_script.sh'

