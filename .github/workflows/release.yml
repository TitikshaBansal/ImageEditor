name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags starting with 'v', e.g., v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Add build steps here if necessary
      # For C++ projects, build binaries or packages

      - name: Set up Git
        run: git config --global user.email "you@example.com" && git config --global user.name "Your Name"

      - name: Create Release Tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0)
          new_tag=$(echo $latest_tag | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          git tag -a $new_tag -m "Release $new_tag"
          git push origin $new_tag

      - name: Package Release
        run: |
          # Replace with commands to package your release artifacts (binaries, packages, etc.)
          # Example: zip -r release.zip bin/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: release-artifacts
          path: release.zip  # Replace with path to your packaged release artifacts


