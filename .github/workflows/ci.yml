name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Build C++ project
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Run tests
        run: |
          # Assuming you have test cases using Google Test
          cd build
          ctest --output-on-failure  # Runs all tests using CTest
